# PyroTV kiosk session for sway (installed to /home/pyrotv/.config/sway/config).
#
# HDMI-A-1 = 10.1" 1280x800 touchscreen (+ USB touch), HDMI-A-2 = optional TV.
# Connector names: `swaymsg -t get_outputs` (inside the session) or
# `ls /sys/class/drm`. Which physical micro-HDMI port is HDMI-A-1 must be
# checked on the Pi (see deploy/README.md); if they are swapped, swap the
# cables, not this file.
#
# UNVERIFIED on hardware: everything here; see the README checklist.

# --- Outputs ------------------------------------------------------------------
output HDMI-A-1 pos 0 0 scale 1
# The panel should announce 1280x800 itself; if it picks a wrong mode, force it:
# output HDMI-A-1 mode 1280x800@60Hz
output HDMI-A-2 pos 1280 0 scale 1

workspace 1 output HDMI-A-1
workspace 2 output HDMI-A-2
focus output HDMI-A-1

# --- Input --------------------------------------------------------------------
# Touches land on the touchscreen even when the TV is connected.
input type:touch map_to_output HDMI-A-1
# Some USB touch controllers register as a tablet instead of a touch device.
input type:tablet_tool map_to_output HDMI-A-1

# No pointer on a touch kiosk: hide the cursor image 100 ms after any motion.
seat * hide_cursor 100
focus_follows_mouse no
mouse_warping none

# --- Look ---------------------------------------------------------------------
# No bar (this config has no `bar` block), no borders/title bars, no gaps.
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
# Nothing here needs X11; saves memory.
xwayland disable

# --- Windows ------------------------------------------------------------------
# Chromium: Debian's build reports app_id "chromium"; the Raspberry Pi build
# may report "chromium-browser". Criteria are regexes, so match both.
assign [app_id="^chromium"] workspace 1
for_window [app_id="^chromium"] move to output HDMI-A-1, fullscreen enable

# mpv (spawned by the backend only when the TV is connected) goes fullscreen
# on the TV and must not steal focus from the touchscreen UI.
no_focus [app_id="mpv"]
for_window [app_id="mpv"] move to output HDMI-A-2, fullscreen enable

# --- Programs -----------------------------------------------------------------
# On-screen keyboard (input-method-v2): pops up when a text field is focused,
# as long as Chromium uses text-input-v3 (kiosk.sh passes the flags).
exec squeekboard
exec /opt/pyrotv/deploy/kiosk.sh
