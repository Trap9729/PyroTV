[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrotv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the versions the test suite runs against (the Pi installs offline-tested builds).
    "fastapi==0.163.2",
    "starlette==1.10.0",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    "pillow==13.0.0",
    "segno==1.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "imageio-ffmpeg",
]

[tool.setuptools]
packages = ["pyrotv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
